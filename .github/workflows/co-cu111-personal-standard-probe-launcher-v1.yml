name: CO Cu111 personal standard-runner survival probe v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: co-cu111-personal-standard-probe-v1
  cancel-in-progress: true

env:
  POLICY: systems/co_cu111/PERSONAL_ACCOUNT_FREE_COMPUTE_POLICY_v0.1.json
  PROTOCOL: systems/co_cu111/SYSTEM2_PBE_L15_L17_SITE_DEPTH_DIAGNOSTIC_v0.2.json
  RUNNER: systems/co_cu111/pbe_l15_l17_site_depth_diagnostic_v2.py
  TEST: systems/co_cu111/test_pbe_l15_l17_site_depth_diagnostic_v2.py
  PROBE_BUILDER: systems/co_cu111/personal_standard_resource_probe_v2.py
  SSSP_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/refs/heads/main/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  SSSP_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  probe:
    name: Non-admissible L15 top standard-runner survival probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Fail closed unless this is the public personal repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['POLICY']))
          assert p['status']=='FROZEN_BEFORE_PERSONAL_ACCOUNT_COMPUTE'
          assert p['target_owner']=='SymCUniverse'
          assert p['target_repository']=='Chemistry'
          assert p['repository_visibility_required']=='public'
          assert p['billing_policy']['github_larger_runners_allowed'] is False
          assert p['billing_policy']['paid_or_custom_github_hosted_runner_labels_allowed'] is False
          assert p['billing_policy']['automatic_paid_escalation_allowed'] is False
          assert p['checkpoint_policy']['new_large_qe_checkpoints_as_actions_artifacts_allowed'] is False
          print('PERSONAL_ZERO_PAID_RUNNER_POLICY_VERIFIED')
          PY
          test "${GITHUB_REPOSITORY}" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'

      - name: Verify unchanged frozen diagnostic code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER" "$TEST" "$PROBE_BUILDER"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL"
          python3 "$TEST" -v

      - name: Install Ubuntu QE for NON-SCIENTIFIC hardware probe only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y quantum-espresso time
          command -v pw.x
          pw.x -h > qe_probe_runtime.txt 2>&1 || true
          sha256sum "$(command -v pw.x)" >> qe_probe_runtime.txt
          {
            echo 'scientific_runtime_admitted=false'
            echo 'purpose=STANDARD_RUNNER_RESOURCE_SURVIVAL_ONLY'
          } >> qe_probe_runtime.txt

      - name: Download exact frozen SSSP pseudopotentials from public source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 "$SSSP_URL" -o sssp.tar.gz
          echo "$SSSP_SHA256  sssp.tar.gz" | sha256sum -c -
          mkdir -p sssp_all pseudos
          tar -xzf sssp.tar.gz -C sssp_all
          for f in \
            Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf \
            C.us.pbe.z_4.uspp.gbrv.v1.2.upf \
            O.paw.pbe.z_6.ld1.psl.v0.1.upf; do
            src=$(find sssp_all -type f -name "$f" -print -quit)
            test -n "$src"
            cp "$src" pseudos/
          done
          echo 'b31028b2bae60cd9903260715a49b4c6d2b6dc654558c87023fa5206e427a16d  pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' | sha256sum -c -
          echo '1795e3fa54d4c3ccf06592136dfebf7aaede82ed223863c30d55ceefb6a787ce  pseudos/C.us.pbe.z_4.uspp.gbrv.v1.2.upf' | sha256sum -c -
          echo 'ac247dc7426e692ce59a64110f04eb4d17f3645ee4f2e907d08ff0e444886730  pseudos/O.paw.pbe.z_6.ld1.psl.v0.1.upf' | sha256sum -c -
          rm -rf sssp.tar.gz sssp_all

      - name: Build actual frozen L15/top 2x2 input without admitting probe runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROBE_BUILDER" pseudos probe_state
          test -s probe_state/site_scf.in
          python3 - <<'PY'
          import json
          m=json.load(open('probe_state/probe_input_metadata.json'))
          assert m['scientific_admissibility']=='NONE_RESOURCE_PROBE_ONLY'
          assert m['runtime_identity_scientifically_admitted'] is False
          assert m['supercell']==[2,2]
          assert m['kmesh']==8
          assert m['nat']==62
          assert m['ecutwfc_ry']==90
          assert m['ecutrho_ry']==900
          print('ACTUAL_L15_TOP_RESOURCE_INPUT_VERIFIED_NONADMISSIBLE')
          PY

      - name: Record standard-runner resources before QE
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo '--- free ---'
            free -h
            echo '--- df ---'
            df -h /
          } | tee resource_before.txt

      - name: Run five-minute non-admissible survival probe
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          /usr/bin/time -v -o resource_usage.txt \
            timeout --signal=TERM --kill-after=30s 300s \
            "$(command -v pw.x)" -in probe_state/site_scf.in \
            > probe_state/site_scf.out 2>&1
          rc=$?
          end=$(date +%s)
          elapsed=$((end-start))
          pkill -f 'pw.x' 2>/dev/null || true
          tail -n 250 probe_state/site_scf.out > probe_tail.txt 2>/dev/null || :
          {
            echo "exit_code=${rc}"
            echo "elapsed_seconds=${elapsed}"
            echo 'scientific_admissibility=NONE_RESOURCE_PROBE_ONLY'
            echo 'checkpoint_evidence_admitted=false'
            echo 'scientific_result_admitted=false'
          } > probe_status.txt
          cat resource_usage.txt || true
          cat probe_status.txt
          rm -rf probe_state/qe_tmp
          if [[ "$rc" -eq 124 && "$elapsed" -ge 295 ]]; then
            echo 'STANDARD_RUNNER_SURVIVED_300_SECOND_QE_PROBE' | tee -a probe_status.txt
            exit 0
          fi
          echo 'STANDARD_RUNNER_PROBE_DID_NOT_SURVIVE_TO_CONTROLLED_TIMEOUT' | tee -a probe_status.txt
          exit 1

      - name: Upload tiny mechanical probe record only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-personal-standard-probe-v1
          path: |
            resource_before.txt
            resource_usage.txt
            probe_status.txt
            probe_tail.txt
            qe_probe_runtime.txt
            probe_state/probe_input_metadata.json
          retention-days: 7
          if-no-files-found: warn
