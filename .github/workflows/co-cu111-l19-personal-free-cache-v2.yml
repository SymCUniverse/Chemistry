name: CO Cu111 L19 personal free-cache convergence v2

on:
  push:
    branches: [personal-free-compute]
    paths:
      - 'systems/co_cu111/PERSONAL_L19_V2_LAUNCH_MARKER.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: co-cu111-l19-personal-free-cache-v2
  cancel-in-progress: false

env:
  POLICY: systems/co_cu111/PERSONAL_ACCOUNT_FREE_COMPUTE_POLICY_v0.1.json
  PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L19_v0.1.json
  RUNNER: systems/co_cu111/pbe_surface_depth_stack_v1.py
  TEST: systems/co_cu111/test_pbe_surface_depth_stack_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  SELECTION_FILE: systems/co_cu111/personal_bootstrap/RANK_SELECTION_RESULT.json

jobs:
  preflight:
    name: Verify personal zero-paid L19 contract v2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce public personal repository and zero-paid policy
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['POLICY']))
          assert p['status']=='FROZEN_BEFORE_PERSONAL_ACCOUNT_COMPUTE'
          assert p['billing_policy']['github_larger_runners_allowed'] is False
          assert p['billing_policy']['paid_or_custom_github_hosted_runner_labels_allowed'] is False
          assert p['billing_policy']['automatic_paid_escalation_allowed'] is False
          assert p['checkpoint_policy']['new_large_qe_checkpoints_as_actions_artifacts_allowed'] is False
          assert p['checkpoint_policy']['actions_cache_default_repository_limit_gb']==10
          assert p['checkpoint_policy']['actions_cache_limit_increase_allowed'] is False
          print('PERSONAL_PUBLIC_ZERO_PAID_POLICY_PASS')
          PY

      - name: Verify frozen L19 files and 11-test firewall
        shell: bash
        run: |
          set -euo pipefail
          echo 'db0ff7ea1e85c4c709548a81351030d90d1db95b2df7d99659e362aba79a0b4f  systems/co_cu111/SYSTEM2_PBE_SURFACE_DEPTH_STACKING_POLICY_v0.1.json' | sha256sum -c -
          echo 'f27ecf8ee22776e695b92549c1f2a8a8818df57d8f8f24033d0cd2c49f5f361e  systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L19_v0.1.json' | sha256sum -c -
          echo '0cd11a12c5f031197e4cc11880e5b0dd963ee83e5b223b1eae308d5bec9e0401  systems/co_cu111/pbe_surface_depth_stack_v1.py' | sha256sum -c -
          echo '7dc5f5cbd5592ee9535b471732bfd2c2e459a4221c8b6d1a1fd6b27c8ed1ba6f  systems/co_cu111/test_pbe_surface_depth_stack_v1.py' | sha256sum -c -
          python3 -m py_compile "$RUNNER" "$TEST"
          python3 "$TEST" -v
          python3 "$RUNNER" self-test --protocol "$PROTOCOL"

      - name: Prepare and hash-verify immutable L17 source evidence locally
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BOOTSTRAP_ZIP"
          test -f "$SELECTION_FILE"
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          test "$(sha256sum "$SELECTION_FILE" | awk '{print $1}')" = 'e8b99f660762724922a9be153b374ccf9fc7f269744570b978d5d2e2b15de0a4'
          rm -rf bootstrap selection
          mkdir bootstrap selection
          unzip -q "$BOOTSTRAP_ZIP" -d bootstrap
          (cd bootstrap && sha256sum -c engine/meta/STAGE_A_ENGINE.sha256)
          test "$(sha256sum bootstrap/engine/bin/pw.x | awk '{print $1}')" = '2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855'
          test "$(sha256sum bootstrap/source_l17_relax/L17_RESTART_STATE.json | awk '{print $1}')" = '3aaf41c304c4238da5804d095c5724f810ff06f67060dccecb3277efa46a1d15'
          test "$(sha256sum bootstrap/source_l17_result/L17_CONVERGENCE_RESULT.json | awk '{print $1}')" = '45eb9c31a954d736f799e70964508c22a2cfb8781e11f171801ad4b4a3681b2d'
          test "$(sha256sum bootstrap/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json | awk '{print $1}')" = '2f77135848bbfb90904cbbf54eeb3ef4e8de3629f5ddcc0b7157a26c6f31fff3'
          cp "$SELECTION_FILE" selection/RANK_SELECTION_RESULT.json
          chmod +x bootstrap/engine/bin/pw.x
          echo 'LOCAL_L17_SOURCE_EVIDENCE_VERIFIED'

      - name: Re-run frozen L19 preflight against actual L17 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" preflight \
            --protocol "$PROTOCOL" \
            --source-relax-root bootstrap/source_l17_relax \
            --source-result-root bootstrap/source_l17_result \
            --out preflight.json \
            --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result bootstrap/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" \
            --pseudo-dir bootstrap/engine/pseudos \
            --pw bootstrap/engine/bin/pw.x \
            --selection selection/RANK_SELECTION_RESULT.json

      - uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l19-personal-preflight-v2
          path: preflight.json
          retention-days: 14
          if-no-files-found: error

  relax_1:
    needs: preflight
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 1, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-01, retention_days: 14}
  relax_2:
    needs: relax_1
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 2, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-01, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-02, retention_days: 14}
  relax_3:
    needs: relax_2
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 3, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-02, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-03, retention_days: 14}
  relax_4:
    needs: relax_3
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 4, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-03, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-04, retention_days: 14}
  relax_5:
    needs: relax_4
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 5, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-04, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-05, retention_days: 14}
  relax_6:
    needs: relax_5
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: relax, segment: 6, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-05, output_cache_key: co-cu111-l19-f27ecf8e-v2-relax-06, retention_days: 30}

  scf_1:
    needs: relax_6
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: scf, segment: 1, prior_cache_key: co-cu111-l19-f27ecf8e-v2-relax-06, output_cache_key: co-cu111-l19-f27ecf8e-v2-scf-01, retention_days: 14}
  scf_2:
    needs: scf_1
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: scf, segment: 2, prior_cache_key: co-cu111-l19-f27ecf8e-v2-scf-01, output_cache_key: co-cu111-l19-f27ecf8e-v2-scf-02, retention_days: 14}
  scf_3:
    needs: scf_2
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: scf, segment: 3, prior_cache_key: co-cu111-l19-f27ecf8e-v2-scf-02, output_cache_key: co-cu111-l19-f27ecf8e-v2-scf-03, retention_days: 14}
  scf_4:
    needs: scf_3
    uses: ./.github/workflows/co-cu111-personal-cache-segment-worker-v2.yml
    with: {stage: scf, segment: 4, prior_cache_key: co-cu111-l19-f27ecf8e-v2-scf-03, output_cache_key: co-cu111-l19-f27ecf8e-v2-scf-04, retention_days: 30}

  adjudicate:
    needs: scf_4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce personal public repository
        run: |
          test "${GITHUB_REPOSITORY}" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'

      - name: Download final small relaxation and SCF provenance states
        uses: actions/download-artifact@v4
        with:
          pattern: l19-*-provenance-v2
          path: provenance_all

      - name: Select segment-6 relaxation and segment-4 SCF states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relax_final scf_final
          find provenance_all -path '*l19-relax-seg6-provenance-v2*' -name SURFACE_DEPTH_RESTART_STATE.json -print -quit | xargs -r -I{} cp '{}' relax_final/SURFACE_DEPTH_RESTART_STATE.json
          find provenance_all -path '*l19-scf-seg4-provenance-v2*' -name SURFACE_DEPTH_RESTART_STATE.json -print -quit | xargs -r -I{} cp '{}' scf_final/SURFACE_DEPTH_RESTART_STATE.json
          test -f relax_final/SURFACE_DEPTH_RESTART_STATE.json
          test -f scf_final/SURFACE_DEPTH_RESTART_STATE.json

      - name: Recover and verify pinned L17 result locally
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir bootstrap_final
          unzip -q "$BOOTSTRAP_ZIP" -d bootstrap_final
          test "$(sha256sum bootstrap_final/source_l17_result/L17_CONVERGENCE_RESULT.json | awk '{print $1}')" = '45eb9c31a954d736f799e70964508c22a2cfb8781e11f171801ad4b4a3681b2d'

      - name: Adjudicate unchanged L19 gates
        shell: bash
        run: |
          set +e
          python3 "$RUNNER" adjudicate \
            --protocol "$PROTOCOL" \
            --source-result-root bootstrap_final/source_l17_result \
            --relax-root relax_final \
            --scf-root scf_final \
            --out L19_CONVERGENCE_RESULT.json
          rc=$?
          set -e
          test -f L19_CONVERGENCE_RESULT.json
          exit "$rc"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l19-personal-convergence-result-v2
          path: L19_CONVERGENCE_RESULT.json
          retention-days: 30
          if-no-files-found: error
