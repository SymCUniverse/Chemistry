name: CO Cu111 personal cache exact segment worker v2

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      segment:
        required: true
        type: number
      prior_cache_key:
        required: false
        type: string
        default: ''
      output_cache_key:
        required: true
        type: string
      retention_days:
        required: false
        type: number
        default: 14

permissions:
  contents: read
  actions: write

env:
  POLICY: systems/co_cu111/PERSONAL_ACCOUNT_FREE_COMPUTE_POLICY_v0.1.json
  PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L19_v0.1.json
  RUNNER: systems/co_cu111/pbe_surface_depth_stack_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  SELECTION_FILE: systems/co_cu111/personal_bootstrap/RANK_SELECTION_RESULT.json
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce public personal zero-paid-runner policy
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['POLICY']))
          assert p['status']=='FROZEN_BEFORE_PERSONAL_ACCOUNT_COMPUTE'
          assert p['billing_policy']['github_larger_runners_allowed'] is False
          assert p['billing_policy']['paid_or_custom_github_hosted_runner_labels_allowed'] is False
          assert p['billing_policy']['automatic_paid_escalation_allowed'] is False
          assert p['checkpoint_policy']['new_large_qe_checkpoints_as_actions_artifacts_allowed'] is False
          assert p['checkpoint_policy']['actions_cache_limit_increase_allowed'] is False
          print('PERSONAL_ZERO_PAID_RUNNER_POLICY_VERIFIED')
          PY

      - name: Reuse this segment if an exact compatible cache already exists
        id: restore-current
        uses: actions/cache/restore@v4
        with:
          path: checkpoint_state_current
          key: ${{ inputs.output_cache_key }}
          fail-on-cache-miss: false

      - name: Verify reused current segment state and replay tiny provenance
        if: ${{ steps.restore-current.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1<<20), b''):
                      h.update(block)
              return h.hexdigest()
          root=pathlib.Path('checkpoint_state_current')
          state=root/'SURFACE_DEPTH_RESTART_STATE.json'
          if not state.is_file(): raise SystemExit('MECHANICAL_HOLD: cached state JSON missing')
          row=json.loads(state.read_text())
          expected_protocol=sha256(pathlib.Path(os.environ['PROTOCOL']))
          if row.get('stage') != os.environ['STAGE'] or int(row.get('segment',-1)) != int(os.environ['SEGMENT']):
              raise SystemExit('MECHANICAL_HOLD: cached stage/segment identity mismatch')
          if row.get('protocol_sha256') != expected_protocol:
              raise SystemExit('MECHANICAL_HOLD: cached protocol hash mismatch')
          if row.get('status') not in {'CHECKPOINT','COMPLETE'}:
              raise SystemExit('MECHANICAL_HOLD: cached state status inadmissible')
          if row.get('scientific_settings_changed') is not False or row.get('thresholds_changed') is not False:
              raise SystemExit('SCIENTIFIC_HOLD: cached state scientific settings drift')
          if row.get('status') == 'CHECKPOINT':
              manifest=root/'QE_CHECKPOINT_MANIFEST.sha256'
              checkpoint=root/'qe_checkpoint'
              if not manifest.is_file() or not checkpoint.is_dir():
                  raise SystemExit('MECHANICAL_HOLD: cached checkpoint evidence incomplete')
              if row.get('checkpoint_manifest_sha256') != sha256(manifest):
                  raise SystemExit('MECHANICAL_HOLD: cached checkpoint manifest hash mismatch')
              for raw in manifest.read_text().splitlines():
                  if not raw.strip(): continue
                  expected, rel=raw.split('  ',1)
                  target=checkpoint/rel
                  if not target.is_file() or sha256(target)!=expected:
                      raise SystemExit(f'MECHANICAL_HOLD: cached checkpoint file drift: {rel}')
          prov=pathlib.Path('provenance')
          prov.mkdir(exist_ok=True)
          shutil.copy2(state, prov/state.name)
          m=root/'QE_CHECKPOINT_MANIFEST.sha256'
          if m.is_file(): shutil.copy2(m, prov/m.name)
          print('EXACT_CURRENT_SEGMENT_CACHE_REUSED_WITHOUT_RECOMPUTATION')
          print(f"status={row['status']}")
          PY

      - name: Install unchanged QE runtime dependencies
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin

      - name: Prepare and hash-verify immutable evidence from personal bootstrap
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BOOTSTRAP_ZIP"
          test -f "$SELECTION_FILE"
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          test "$(sha256sum "$SELECTION_FILE" | awk '{print $1}')" = 'e8b99f660762724922a9be153b374ccf9fc7f269744570b978d5d2e2b15de0a4'
          rm -rf bootstrap source_relax engine stage_a_decision selection
          mkdir bootstrap
          unzip -q "$BOOTSTRAP_ZIP" -d bootstrap
          (cd bootstrap && sha256sum -c engine/meta/STAGE_A_ENGINE.sha256)
          test "$(sha256sum bootstrap/engine/bin/pw.x | awk '{print $1}')" = '2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855'
          test "$(sha256sum bootstrap/source_l17_relax/L17_RESTART_STATE.json | awk '{print $1}')" = '3aaf41c304c4238da5804d095c5724f810ff06f67060dccecb3277efa46a1d15'
          test "$(sha256sum bootstrap/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json | awk '{print $1}')" = '2f77135848bbfb90904cbbf54eeb3ef4e8de3629f5ddcc0b7157a26c6f31fff3'
          cp -a bootstrap/source_l17_relax source_relax
          cp -a bootstrap/engine engine
          cp -a bootstrap/stage_a_decision stage_a_decision
          mkdir selection
          cp "$SELECTION_FILE" selection/RANK_SELECTION_RESULT.json
          chmod +x engine/bin/pw.x
          echo 'LOCAL_BOOTSTRAP_EVIDENCE_VERIFIED'

      - name: Restore exact prior QE state from included repository cache
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' && inputs.prior_cache_key != '' }}
        id: restore-prior
        uses: actions/cache/restore@v4
        with:
          path: checkpoint_state
          key: ${{ inputs.prior_cache_key }}
          fail-on-cache-miss: true

      - name: Run exact-restart segment without paid runner or artifact checkpoint storage
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          common=(--protocol "$PROTOCOL" --segment "$SEGMENT" --out state --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json)
          if [[ "$STAGE" == 'relax' ]]; then
            extra=(--source-relax-root source_relax)
            if [[ "$SEGMENT" -gt 1 ]]; then extra+=(--prior-root checkpoint_state); fi
            python3 "$RUNNER" relax-segment "${common[@]}" "${extra[@]}"
          elif [[ "$STAGE" == 'scf' ]]; then
            if [[ "$SEGMENT" -eq 1 ]]; then
              python3 "$RUNNER" scf-segment "${common[@]}" --relax-root checkpoint_state
            else
              python3 "$RUNNER" scf-segment "${common[@]}" --prior-root checkpoint_state
            fi
          else
            echo "MECHANICAL_HOLD: unknown stage $STAGE" >&2
            exit 2
          fi

      - name: Verify state, build tiny provenance record, and enforce cache ceiling
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' }}
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, os, pathlib, shutil
          root=pathlib.Path('state')
          state=root/'SURFACE_DEPTH_RESTART_STATE.json'
          if not state.is_file():
              raise SystemExit('MECHANICAL_HOLD: missing restart state')
          row=json.loads(state.read_text())
          status=row.get('status')
          if status not in {'CHECKPOINT','COMPLETE'}:
              raise SystemExit(f'MECHANICAL_HOLD: inadmissible restart status {status!r}')
          if row.get('scientific_settings_changed') is not False or row.get('thresholds_changed') is not False:
              raise SystemExit('SCIENTIFIC_HOLD: produced state changed frozen science')
          prov=pathlib.Path('provenance')
          prov.mkdir(exist_ok=True)
          shutil.copy2(state, prov/state.name)
          for name in ('relax.in','relax.out','scf.in','scf.out','QE_CHECKPOINT_MANIFEST.sha256'):
              p=root/name
              if p.is_file():
                  if p.suffix == '.out':
                      with p.open('rb') as src, gzip.open(prov/(p.name+'.gz'),'wb',compresslevel=9) as dst:
                          shutil.copyfileobj(src,dst)
                  else:
                      shutil.copy2(p, prov/p.name)
          if status == 'COMPLETE':
              shutil.rmtree(root/'qe_checkpoint', ignore_errors=True)
              m=root/'QE_CHECKPOINT_MANIFEST.sha256'
              if m.exists(): m.unlink()
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write(f'status={status}\n')
          print(f'status={status}')
          PY
          bytes=$(du -sb state | awk '{print $1}')
          echo "cache_bytes=${bytes}" | tee -a "$GITHUB_OUTPUT"
          if [[ "$bytes" -gt 9500000000 ]]; then
            echo 'FREE_CACHE_SIZE_HOLD: restart state exceeds 9.5 GB ceiling' >&2
            exit 3
          fi
          prov_bytes=$(du -sb provenance | awk '{print $1}')
          if [[ "$prov_bytes" -gt 30000000 ]]; then
            echo 'FREE_ARTIFACT_SIZE_HOLD: provenance bundle exceeds 30 MB' >&2
            exit 4
          fi
          rm -rf checkpoint_state
          mv state checkpoint_state

      - name: Save newest exact state to included repository cache
        if: ${{ steps.restore-current.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: checkpoint_state
          key: ${{ inputs.output_cache_key }}

      - name: Upload only small provenance, never the multi-GB QE checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: l19-${{ inputs.stage }}-seg${{ inputs.segment }}-provenance-v2
          path: provenance
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
