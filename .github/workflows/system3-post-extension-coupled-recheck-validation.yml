name: System3 post-extension coupled recheck runner validation

on:
  push:
    branches:
      - personal-free-compute
    paths:
      - '.github/workflows/system3-post-extension-coupled-recheck-validation.yml'
      - 'systems/h_ru0001/system3_post_extension_coupled_recheck_v1.py'
      - 'systems/h_ru0001/system3_clean_ru0001_layer_extension_v1.py'
      - 'systems/h_ru0001/system3_clean_ru0001_numerical_v1.py'
      - 'systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_GATE_GUARD_v0.1.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_SURFACE_PROTOCOL_v0.2.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_RELAXATION_PROTOCOL_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-coupled-recheck-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
      - name: Validate coupled endpoint recheck runner and decision logic
        run: >-
          python systems/h_ru0001/system3_post_extension_coupled_recheck_v1.py self-test
          --guard systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_GATE_GUARD_v0.1.json
          --extension-protocol systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json
          --surface-protocol systems/h_ru0001/SYSTEM3_CLEAN_RU0001_SURFACE_PROTOCOL_v0.2.json
          --relaxation-protocol systems/h_ru0001/SYSTEM3_CLEAN_RU0001_RELAXATION_PROTOCOL_v0.1.json
