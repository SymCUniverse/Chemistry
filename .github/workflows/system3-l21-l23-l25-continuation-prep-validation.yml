name: System3 L21 L23 L25 continuation prep validation

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-l21-l23-l25-continuation-prep-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce public zero-paid validation route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          echo SYSTEM3_CONTINUATION_PREP_ZERO_PAID_ROUTE_PASS

      - name: Compile and validate preauthorized continuation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile systems/h_ru0001/system3_next_odd_layer_continuation_v1.py
          python3 systems/h_ru0001/system3_next_odd_layer_continuation_v1.py self-test \
            --parent-protocol systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json \
            --guard systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_GATE_GUARD_v0.1.json
