name: System3 H Ru0001 successor endpoint checkpoint recovery v1

on:
  push:
    branches:
      - personal-free-compute
    paths:
      - '.github/workflows/system3-successor-endpoint-checkpoint-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY: systems/h_ru0001/SYSTEM3_SUCCESSOR_FAILED_ENDPOINTS_CHECKPOINT_RECOVERY_v0.1.json
  SUCCESSOR_PROTOCOL: systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PROTOCOL_v0.1.json
  PRESERVED: systems/h_ru0001/SYSTEM3_SUCCESSOR_BASE_VACUUM_VALID_EVIDENCE_v0.1.json
  RECOVERY_RUNNER: systems/h_ru0001/system3_successor_endpoint_checkpoint_recovery_v1.py
  RECOVERY_RUNNER_BLOB_SHA: 0d9d89aca416b2ba2fc38264519e8abfddd01f6a
  QUAL_RUNNER: systems/h_ru0001/system3_successor_fixed_grid_qualification_v1.py
  QUAL_RUNNER_BLOB_SHA: d51e3eb5a0d4c2924adc2216a53a73c4db92351a
  PREPARATION_PROTOCOL: systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PREPARATION_PROTOCOL_v0.1.json
  EXTENSION_PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json
  HOLD_RECORD: systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_HOLD_RECORD_v0.1.json
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  segment-1:
    strategy:
      fail-fast: false
      matrix:
        case: [kmesh, layers]
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Checkout exact recovery state
        uses: actions/checkout@v4
      - name: Enforce public zero-paid route and frozen recovery identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          test "$(git hash-object "$RECOVERY_RUNNER")" = "$RECOVERY_RUNNER_BLOB_SHA"
          test "$(git hash-object "$QUAL_RUNNER")" = "$QUAL_RUNNER_BLOB_SHA"
          python3 "$RECOVERY_RUNNER" self-test --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Run fresh successor ${{ matrix.case }} recovery segment 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RECOVERY_RUNNER" run-segment \
            --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" \
            --case "${{ matrix.case }}" --segment 1 \
            --pw engine/bin/pw.x --pseudo-dir hr_pseudos \
            --out "recovery_${{ matrix.case }}_segment_1"
      - name: Upload successor ${{ matrix.case }} segment 1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-recovery-segment-1-v1
          path: recovery_${{ matrix.case }}_segment_1
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-2:
    needs: [segment-1]
    strategy:
      fail-fast: false
      matrix:
        case: [kmesh, layers]
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Checkout exact recovery state
        uses: actions/checkout@v4
      - name: Download prior ${{ matrix.case }} checkpoint
        uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-recovery-segment-1-v1
          path: previous
      - name: Revalidate frozen recovery identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RECOVERY_RUNNER")" = "$RECOVERY_RUNNER_BLOB_SHA"
          test "$(git hash-object "$QUAL_RUNNER")" = "$QUAL_RUNNER_BLOB_SHA"
          python3 "$RECOVERY_RUNNER" self-test --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume fresh successor ${{ matrix.case }} recovery segment 2
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RECOVERY_RUNNER" run-segment \
            --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" \
            --case "${{ matrix.case }}" --segment 2 --previous previous \
            --pw engine/bin/pw.x --pseudo-dir hr_pseudos \
            --out "recovery_${{ matrix.case }}_segment_2"
      - name: Upload successor ${{ matrix.case }} segment 2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-recovery-segment-2-v1
          path: recovery_${{ matrix.case }}_segment_2
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-3:
    needs: [segment-2]
    strategy:
      fail-fast: false
      matrix:
        case: [kmesh, layers]
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Checkout exact recovery state
        uses: actions/checkout@v4
      - name: Download prior ${{ matrix.case }} checkpoint
        uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-recovery-segment-2-v1
          path: previous
      - name: Revalidate frozen recovery identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RECOVERY_RUNNER")" = "$RECOVERY_RUNNER_BLOB_SHA"
          test "$(git hash-object "$QUAL_RUNNER")" = "$QUAL_RUNNER_BLOB_SHA"
          python3 "$RECOVERY_RUNNER" self-test --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume fresh successor ${{ matrix.case }} recovery segment 3
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RECOVERY_RUNNER" run-segment \
            --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" \
            --case "${{ matrix.case }}" --segment 3 --previous previous \
            --pw engine/bin/pw.x --pseudo-dir hr_pseudos \
            --out "recovery_${{ matrix.case }}_segment_3"
      - name: Upload successor ${{ matrix.case }} segment 3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-recovery-segment-3-v1
          path: recovery_${{ matrix.case }}_segment_3
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  adjudicate-recovered-successor:
    needs: [segment-3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery state
        uses: actions/checkout@v4
      - name: Download recovered kmesh endpoint
        uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-successor-kmesh-recovery-segment-3-v1
          path: kmesh_bundle
      - name: Download recovered layers endpoint
        uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-successor-layers-recovery-segment-3-v1
          path: layers_bundle
      - name: Revalidate runners and materialize all four fresh cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RECOVERY_RUNNER")" = "$RECOVERY_RUNNER_BLOB_SHA"
          test "$(git hash-object "$QUAL_RUNNER")" = "$QUAL_RUNNER_BLOB_SHA"
          python3 "$RECOVERY_RUNNER" self-test --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED"
          mkdir -p successor_results/base successor_results/vacuum successor_results/kmesh successor_results/layers adjudication
          python3 "$RECOVERY_RUNNER" materialize-preserved --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" --case base --out successor_results/base/SYSTEM3_SUCCESSOR_BASE_RESULT.json
          python3 "$RECOVERY_RUNNER" materialize-preserved --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" --case vacuum --out successor_results/vacuum/SYSTEM3_SUCCESSOR_VACUUM_RESULT.json
          python3 "$RECOVERY_RUNNER" finalize --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" --case kmesh --bundle kmesh_bundle --out successor_results/kmesh/SYSTEM3_SUCCESSOR_KMESH_RESULT.json
          python3 "$RECOVERY_RUNNER" finalize --recovery "$RECOVERY" --successor-protocol "$SUCCESSOR_PROTOCOL" --preserved-evidence "$PRESERVED" --case layers --bundle layers_bundle --out successor_results/layers/SYSTEM3_SUCCESSOR_LAYERS_RESULT.json
      - name: Apply original frozen successor qualification adjudicator
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QUAL_RUNNER" validate-protocol \
            --preparation-protocol "$PREPARATION_PROTOCOL" --extension-protocol "$EXTENSION_PROTOCOL" --hold "$HOLD_RECORD" --successor-protocol "$SUCCESSOR_PROTOCOL"
          python3 "$QUAL_RUNNER" adjudicate \
            --preparation-protocol "$PREPARATION_PROTOCOL" --extension-protocol "$EXTENSION_PROTOCOL" --hold "$HOLD_RECORD" --successor-protocol "$SUCCESSOR_PROTOCOL" \
            --results-root successor_results \
            --out adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1_checkpoint_recovery.json
          cat adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1_checkpoint_recovery.json
      - name: Enforce scientific routing from recovered successor outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1_checkpoint_recovery.json'
          r=json.load(open(p))
          assert r['original_K16_coupled_hold_preserved'] is True
          assert r['all_four_cases_fresh'] is True
          assert r['diagnostic_energies_reused_as_PASS_evidence'] is False
          assert r['tolerance_ev_per_surface_atom']==0.001
          if r['status']=='CLEAN_SURFACE_FIXED_GRID_PASS':
              assert r['relaxation_authorized'] is True
              assert r['next_gate']=='H_RU0001_CLEAN_SURFACE_RELAXATION_AND_REPRODUCTION'
          elif r['status']=='CLEAN_SURFACE_SUCCESSOR_COUPLED_CONVERGENCE_HOLD':
              assert r['relaxation_authorized'] is False
              assert r['next_gate'] is None
          else:
              raise SystemExit('MECHANICAL_HOLD: unexpected recovered successor status')
          print('RECOVERED_SUCCESSOR_STATUS='+r['status'])
          print('RELAXATION_AUTHORIZED='+str(r['relaxation_authorized']).lower())
          PY
      - name: Upload recovered successor qualification adjudication
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-recovered-adjudication-v1
          path: |
            successor_results
            adjudication
          retention-days: 90
          if-no-files-found: error
