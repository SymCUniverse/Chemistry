name: System3 personal exact runtime recovery v2

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-personal-runtime-recovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  H_SHA256: f4e1cad6afe24cfaa879aed5d8f4ce716102b626a4e3a622a303419624960036
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/refs/heads/main/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz

jobs:
  recover-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute
      - name: Enforce personal public zero-paid route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          echo SYSTEM3_EXACT_RUNTIME_ZERO_PAID_ROUTE_PASS
      - name: Recover exact pw.x
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p recovered/engine/bin recovered/pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > recovered/engine/bin/pw.x
          test "$(sha256sum recovered/engine/bin/pw.x | awk '{print $1}')" = "$PW_SHA256"
          chmod +x recovered/engine/bin/pw.x
      - name: Recover exact SSSP v2 PBE efficiency bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o recovered/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  recovered/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf recovered/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > recovered/pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          tar -xOf recovered/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/H.us.pbe.z_1.uspp.gbrv.v1.4.upf > recovered/pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf
          echo "$RU_SHA256  recovered/pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          echo "$H_SHA256  recovered/pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf" | sha256sum -c -
          echo SYSTEM3_EXACT_SSSP_V2_PSEUDOS_PASS
      - name: Write exact runtime recovery record
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('recovered')
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(8<<20),b''): h.update(b)
              return h.hexdigest()
          row={
            'schema':'system3-personal-exact-runtime-recovery-v0.2',
            'status':'PASS_EXACT_RUNTIME_RECONSTRUCTED',
            'pw_sha256':sha(root/'engine/bin/pw.x'),
            'sssp_v2_tar_sha256':sha(root/'SSSP-lib-pbe-eff-v2.tar.gz'),
            'ru_sha256':sha(root/'pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf'),
            'h_sha256':sha(root/'pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf'),
            'source_url':'https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/refs/heads/main/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz',
            'scientific_compute_started':False,
            'scientific_settings_changed':False,
            'thresholds_changed':False,
            'paid_compute_used':False,
          }
          assert row['pw_sha256']=='2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855'
          assert row['sssp_v2_tar_sha256']=='67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2'
          assert row['ru_sha256']=='ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd'
          assert row['h_sha256']=='f4e1cad6afe24cfaa879aed5d8f4ce716102b626a4e3a622a303419624960036'
          pathlib.Path('SYSTEM3_EXACT_RUNTIME_RECOVERY_RESULT.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print(json.dumps(row,indent=2,sort_keys=True))
          print('SYSTEM3_PERSONAL_EXACT_RUNTIME_RECOVERY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: system3-personal-exact-runtime-recovery-v2
          path: SYSTEM3_EXACT_RUNTIME_RECOVERY_RESULT.json
          retention-days: 30
          if-no-files-found: error
