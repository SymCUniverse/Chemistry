name: System3 H Ru0001 successor fixed-grid production v1

on:
  push:
    branches:
      - personal-free-compute
    paths:
      - 'systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PROTOCOL_v0.1.json'

permissions:
  contents: read

env:
  SUCCESSOR_PROTOCOL: systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PROTOCOL_v0.1.json
  PREPARATION_PROTOCOL: systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PREPARATION_PROTOCOL_v0.1.json
  EXTENSION_PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json
  HOLD_RECORD: systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_HOLD_RECORD_v0.1.json
  RUNNER: systems/h_ru0001/system3_successor_fixed_grid_qualification_v1.py
  RUNNER_BLOB_SHA: d51e3eb5a0d4c2924adc2216a53a73c4db92351a
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  successor-case:
    strategy:
      fail-fast: false
      matrix:
        case: [base, kmesh, vacuum, layers]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout exact successor state
        uses: actions/checkout@v4
      - name: Enforce standard public zero-paid route and exact runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          echo SYSTEM3_SUCCESSOR_ZERO_PAID_ROUTE_AND_RUNNER_IDENTITY_PASS
      - name: Validate successor protocol and preserved HOLD lineage
        run: >-
          python3 "$RUNNER" validate-protocol
          --preparation-protocol "$PREPARATION_PROTOCOL"
          --extension-protocol "$EXTENSION_PROTOCOL"
          --hold "$HOLD_RECORD"
          --successor-protocol "$SUCCESSOR_PROTOCOL"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Run fresh successor case ${{ matrix.case }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-case \
            --preparation-protocol "$PREPARATION_PROTOCOL" \
            --extension-protocol "$EXTENSION_PROTOCOL" \
            --hold "$HOLD_RECORD" \
            --successor-protocol "$SUCCESSOR_PROTOCOL" \
            --case "${{ matrix.case }}" \
            --pw engine/bin/pw.x \
            --pseudo-dir hr_pseudos \
            --out "successor_${{ matrix.case }}"
      - name: Upload fresh successor case
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-${{ matrix.case }}-v1
          path: successor_${{ matrix.case }}
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  adjudicate-successor:
    needs: [successor-case]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact successor state
        uses: actions/checkout@v4
      - name: Revalidate exact runner and successor protocol before adjudication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          python3 "$RUNNER" validate-protocol \
            --preparation-protocol "$PREPARATION_PROTOCOL" \
            --extension-protocol "$EXTENSION_PROTOCOL" \
            --hold "$HOLD_RECORD" \
            --successor-protocol "$SUCCESSOR_PROTOCOL"
      - name: Download all fresh successor cases
        uses: actions/download-artifact@v4
        with:
          pattern: system3-h-ru0001-successor-*-v1
          path: successor_results
      - name: Apply unchanged 1 meV fresh coupled adjudication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adjudication
          python3 "$RUNNER" adjudicate \
            --preparation-protocol "$PREPARATION_PROTOCOL" \
            --extension-protocol "$EXTENSION_PROTOCOL" \
            --hold "$HOLD_RECORD" \
            --successor-protocol "$SUCCESSOR_PROTOCOL" \
            --results-root successor_results \
            --out adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1.json
          cat adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1.json
      - name: Enforce relaxation gate from successor outcome
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('adjudication/SYSTEM3_SUCCESSOR_FIXED_GRID_QUALIFICATION_RESULT_v0.1.json'))
          if r['status']=='CLEAN_SURFACE_FIXED_GRID_PASS':
              assert r['relaxation_authorized'] is True
              assert r['next_gate']=='H_RU0001_CLEAN_SURFACE_RELAXATION_AND_REPRODUCTION'
              print('SUCCESSOR_RELAXATION_ENTRY_AUTHORIZED=true')
          elif r['status']=='CLEAN_SURFACE_SUCCESSOR_COUPLED_CONVERGENCE_HOLD':
              assert r['relaxation_authorized'] is False
              assert r['next_gate'] is None
              print('SUCCESSOR_RELAXATION_ENTRY_AUTHORIZED=false')
          else:
              raise SystemExit('MECHANICAL_HOLD: unexpected successor qualification status')
          assert r['original_K16_coupled_hold_preserved'] is True
          assert r['diagnostic_energies_reused_as_PASS_evidence'] is False
          PY
      - name: Upload successor adjudication
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-successor-fixed-grid-adjudication-v1
          path: adjudication
          retention-days: 90
          if-no-files-found: error
