name: System3 H Ru0001 L17 L19 timeout recovery v5

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-h-ru0001-layer-extension-timeout-recovery-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json
  SOURCE: systems/h_ru0001/SYSTEM3_CLEAN_SURFACE_V3_SOURCE_LAYER_EVIDENCE_v0.1.json
  RECOVERY: systems/h_ru0001/SYSTEM3_LAYER_EXTENSION_L17_L19_TIMEOUT_RECOVERY_v0.1.json
  L15_INTERIM: systems/h_ru0001/SYSTEM3_LAYER_EXTENSION_L15_INTERIM_EVIDENCE_v0.1.json
  RECOVERY_RUNNER: systems/h_ru0001/system3_layer_extension_timeout_recovery_v1.py
  ORIGINAL_RUNNER: systems/h_ru0001/system3_clean_ru0001_layer_extension_v1.py
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  recover-layer:
    strategy:
      fail-fast: false
      matrix:
        layers: [17, 19]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce personal public zero-paid recovery route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          echo SYSTEM3_TIMEOUT_RECOVERY_ZERO_PAID_ROUTE_PASS

      - name: Verify frozen mechanical recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$PROTOCOL" >/dev/null
          python3 -m json.tool "$SOURCE" >/dev/null
          python3 -m json.tool "$RECOVERY" >/dev/null
          python3 -m json.tool "$L15_INTERIM" >/dev/null
          python3 -m py_compile "$RECOVERY_RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RECOVERY_RUNNER" self-test \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE" \
            --recovery "$RECOVERY" \
            --l15-interim "$L15_INTERIM"

      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin

      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
          echo SYSTEM3_TIMEOUT_RECOVERY_EXACT_RUNTIME_PASS

      - name: Recover timed-out frozen layer
        shell: bash
        run: |
          set -euo pipefail
          out="system3_recovery_L${{ matrix.layers }}"
          python3 "$RECOVERY_RUNNER" run-layer \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE" \
            --recovery "$RECOVERY" \
            --l15-interim "$L15_INTERIM" \
            --layers "${{ matrix.layers }}" \
            --pw engine/bin/pw.x \
            --pseudo-dir hr_pseudos \
            --out "$out"

      - name: Upload recovered layer evidence
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-layer-${{ matrix.layers }}-v5-recovery
          path: system3_recovery_L${{ matrix.layers }}
          retention-days: 90
          if-no-files-found: error

  adjudicate-recovered-extension:
    needs: recover-layer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce personal public zero-paid adjudication route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'

      - name: Verify unchanged recovery and original adjudication contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RECOVERY_RUNNER" self-test \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE" \
            --recovery "$RECOVERY" \
            --l15-interim "$L15_INTERIM"
          python3 "$ORIGINAL_RUNNER" self-test \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE"

      - name: Download recovered L17 and L19 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: system3-h-ru0001-layer-*-v5-recovery
          path: system3_recovery_inputs

      - name: Materialize preserved valid L15 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p system3_recovery_inputs/system3-h-ru0001-layer-15-v4
          python3 "$RECOVERY_RUNNER" materialize-l15 \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE" \
            --recovery "$RECOVERY" \
            --l15-interim "$L15_INTERIM" \
            --out system3_recovery_inputs/system3-h-ru0001-layer-15-v4/SYSTEM3_LAYER_L15_RESULT.json

      - name: Adjudicate original unchanged 1 meV suffix criterion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p system3_extension_recovery_adjudication
          python3 "$ORIGINAL_RUNNER" adjudicate \
            --protocol "$PROTOCOL" \
            --source-evidence "$SOURCE" \
            --results-root system3_recovery_inputs \
            --out system3_extension_recovery_adjudication/SYSTEM3_CLEAN_SURFACE_LAYER_EXTENSION_RESULT_v0.3_recovery.json
          cat system3_extension_recovery_adjudication/SYSTEM3_CLEAN_SURFACE_LAYER_EXTENSION_RESULT_v0.3_recovery.json

      - name: Upload recovered extension adjudication
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-layer-extension-adjudication-v5-recovery
          path: system3_extension_recovery_adjudication
          retention-days: 90
          if-no-files-found: error
