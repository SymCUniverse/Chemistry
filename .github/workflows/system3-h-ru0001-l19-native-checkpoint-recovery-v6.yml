name: System3 H Ru0001 L19 native checkpoint recovery v6

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-h-ru0001-l19-native-checkpoint-recovery-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json
  SOURCE: systems/h_ru0001/SYSTEM3_CLEAN_SURFACE_V3_SOURCE_LAYER_EVIDENCE_v0.1.json
  RECOVERY: systems/h_ru0001/SYSTEM3_LAYER_EXTENSION_L19_SECOND_TIMEOUT_CHECKPOINT_RECOVERY_v0.1.json
  L15: systems/h_ru0001/SYSTEM3_LAYER_EXTENSION_L15_INTERIM_EVIDENCE_v0.1.json
  L17: systems/h_ru0001/SYSTEM3_LAYER_EXTENSION_L17_INTERIM_EVIDENCE_v0.1.json
  RUNNER: systems/h_ru0001/system3_l19_native_checkpoint_recovery_v1.py
  ORIGINAL_RUNNER: systems/h_ru0001/system3_clean_ru0001_layer_extension_v1.py
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  segment-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Enforce public zero-paid checkpoint route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          echo SYSTEM3_L19_CHECKPOINT_ZERO_PAID_ROUTE_PASS
      - name: Verify frozen checkpoint recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$RECOVERY" >/dev/null
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Run L19 native checkpoint segment 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --segment 1 --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out l19_bundle_1
      - name: Upload L19 segment 1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-1-v6
          path: l19_bundle_1
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-2:
    needs: segment-1
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-1-v6
          path: previous_bundle
      - name: Verify frozen checkpoint recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume L19 native checkpoint segment 2
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --segment 2 --previous previous_bundle --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out l19_bundle_2
      - name: Upload L19 segment 2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-2-v6
          path: l19_bundle_2
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-3:
    needs: segment-2
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-2-v6
          path: previous_bundle
      - name: Verify frozen checkpoint recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume L19 native checkpoint segment 3
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --segment 3 --previous previous_bundle --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out l19_bundle_3
      - name: Upload L19 segment 3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-3-v6
          path: l19_bundle_3
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  adjudicate-recovered-extension:
    needs: segment-3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-l19-checkpoint-segment-3-v6
          path: final_bundle
      - name: Verify and materialize complete L15 L17 L19 evidence set
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" self-test --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17"
          mkdir -p recovered_inputs/l15 recovered_inputs/l17 recovered_inputs/l19
          python3 "$RUNNER" materialize-interim --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --layers 15 --out recovered_inputs/l15/SYSTEM3_LAYER_L15_RESULT.json
          python3 "$RUNNER" materialize-interim --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --layers 17 --out recovered_inputs/l17/SYSTEM3_LAYER_L17_RESULT.json
          python3 "$RUNNER" finalize --protocol "$PROTOCOL" --source-evidence "$SOURCE" --recovery "$RECOVERY" --l15-interim "$L15" --l17-interim "$L17" --bundle final_bundle --out recovered_inputs/l19/SYSTEM3_LAYER_L19_RESULT.json
      - name: Apply original unchanged 1 meV suffix adjudicator
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ORIGINAL_RUNNER" self-test --protocol "$PROTOCOL" --source-evidence "$SOURCE"
          mkdir -p adjudication
          python3 "$ORIGINAL_RUNNER" adjudicate --protocol "$PROTOCOL" --source-evidence "$SOURCE" --results-root recovered_inputs --out adjudication/SYSTEM3_CLEAN_SURFACE_LAYER_EXTENSION_RESULT_v0.3_checkpoint_recovery.json
          cat adjudication/SYSTEM3_CLEAN_SURFACE_LAYER_EXTENSION_RESULT_v0.3_checkpoint_recovery.json
      - name: Enforce post-extension lineage guard routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('adjudication/SYSTEM3_CLEAN_SURFACE_LAYER_EXTENSION_RESULT_v0.3_checkpoint_recovery.json'))
          if r['status']=='CLEAN_SURFACE_LAYER_EXTENSION_PASS':
              assert r['next_gate']=='H_RU0001_CLEAN_SURFACE_RELAXATION_AND_REPRODUCTION'
              print('ROUTE_OVERRIDE_BY_FROZEN_GUARD=COUPLED_ENDPOINT_RECHECK_BEFORE_RELAXATION')
              print('DIRECT_RELAXATION_FORBIDDEN=true')
          elif r['status']=='CLEAN_SURFACE_LAYER_EXTENSION_HOLD':
              assert r['next_batch_if_hold']==[21,23,25]
              print('ROUTE=PREAUTHORIZED_L21_L23_L25_AFTER_NEW_HASH_BINDING')
          else:
              raise SystemExit('MECHANICAL_HOLD: unexpected extension adjudication status')
          PY
      - name: Upload checkpoint-recovered extension adjudication
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-layer-extension-adjudication-v6-checkpoint-recovery
          path: adjudication
          retention-days: 90
          if-no-files-found: error
