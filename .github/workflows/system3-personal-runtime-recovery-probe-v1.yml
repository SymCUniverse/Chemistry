name: System3 personal runtime recovery probe v1

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-personal-runtime-recovery-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_MD5: f8cc8b73c5736fca6a9a6cb14813db9b
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  H_SHA256: f4e1cad6afe24cfaa879aed5d8f4ce716102b626a4e3a622a303419624960036

jobs:
  recover-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-free-compute

      - name: Enforce personal public zero-paid route
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          echo 'SYSTEM3_RUNTIME_PROBE_ZERO_PAID_ROUTE_PASS'

      - name: Recover and verify exact pw.x from personal bootstrap
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p recovered/engine/bin
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > recovered/engine/bin/pw.x
          test "$(sha256sum recovered/engine/bin/pw.x | awk '{print $1}')" = "$PW_SHA256"
          chmod +x recovered/engine/bin/pw.x
          echo 'SYSTEM3_EXACT_PW_RECOVERY_PASS'

      - name: Download published SSSP 1.2 PBE efficiency archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/sssp recovered/pseudos
          urls=(
            'https://archive.materialscloud.org/records/dx741-aqf15/files/SSSP_1.2_PBE_efficiency.tar.gz?download=1'
            'https://materialscloud-archive-failover.cineca.it/records/dx741-aqf15/files/SSSP_1.2_PBE_efficiency.tar.gz?download=1'
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f recovered/sssp/SSSP_1.2_PBE_efficiency.tar.gz
            if curl -fL --retry 2 --connect-timeout 30 --max-time 300 "$url" -o recovered/sssp/SSSP_1.2_PBE_efficiency.tar.gz; then
              if [ "$(md5sum recovered/sssp/SSSP_1.2_PBE_efficiency.tar.gz | awk '{print $1}')" = "$SSSP_MD5" ]; then
                printf '%s\n' "$url" > recovered/sssp/SOURCE_URL.txt
                ok=1
                break
              fi
            fi
          done
          test "$ok" -eq 1
          echo 'SYSTEM3_SSSP_ARCHIVE_IDENTITY_PASS'

      - name: Extract and verify exact frozen H and Ru pseudopotentials
        shell: bash
        run: |
          set -euo pipefail
          archive=recovered/sssp/SSSP_1.2_PBE_efficiency.tar.gz
          mapfile -t ru_hits < <(tar -tzf "$archive" | grep -E '(^|/)Ru\.nc\.pbe\.z_16\.oncvpsp4\.sg15\.v0\.upf$')
          mapfile -t h_hits < <(tar -tzf "$archive" | grep -E '(^|/)H\.us\.pbe\.z_1\.uspp\.gbrv\.v1\.4\.upf$')
          test "${#ru_hits[@]}" -eq 1
          test "${#h_hits[@]}" -eq 1
          tar -xOf "$archive" "${ru_hits[0]}" > recovered/pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          tar -xOf "$archive" "${h_hits[0]}" > recovered/pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf
          test "$(sha256sum recovered/pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf | awk '{print $1}')" = "$RU_SHA256"
          test "$(sha256sum recovered/pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf | awk '{print $1}')" = "$H_SHA256"
          echo 'SYSTEM3_EXACT_PSEUDOPOTENTIAL_RECOVERY_PASS'

      - name: Write recovery result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('recovered')
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          row={
            'schema':'system3-personal-runtime-recovery-probe-v0.1',
            'status':'PASS_EXACT_RUNTIME_RECONSTRUCTED' if all([
              sha(root/'engine/bin/pw.x')=='2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855',
              sha(root/'pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf')=='ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd',
              sha(root/'pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf')=='f4e1cad6afe24cfaa879aed5d8f4ce716102b626a4e3a622a303419624960036'
            ]) else 'FAIL',
            'pw_sha256':sha(root/'engine/bin/pw.x'),
            'ru_sha256':sha(root/'pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf'),
            'h_sha256':sha(root/'pseudos/H.us.pbe.z_1.uspp.gbrv.v1.4.upf'),
            'sssp_source_url':(root/'sssp/SOURCE_URL.txt').read_text().strip(),
            'scientific_settings_changed':False,
            'thresholds_changed':False,
            'paid_compute_used':False,
            'scientific_compute_started':False,
          }
          pathlib.Path('SYSTEM3_RUNTIME_RECOVERY_PROBE_RESULT.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          print(json.dumps(row,indent=2,sort_keys=True))
          assert row['status']=='PASS_EXACT_RUNTIME_RECONSTRUCTED'
          print('SYSTEM3_PERSONAL_RUNTIME_RECOVERY_PROBE_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system3-personal-runtime-recovery-probe-v1
          path: SYSTEM3_RUNTIME_RECOVERY_PROBE_RESULT.json
          retention-days: 14
          if-no-files-found: warn
