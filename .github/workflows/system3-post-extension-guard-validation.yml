name: System3 post-extension guard validation

on:
  push:
    branches:
      - personal-free-compute
    paths:
      - '.github/workflows/system3-post-extension-guard-validation.yml'
      - 'systems/h_ru0001/test_system3_post_extension_coupled_guard_v1.py'
      - 'systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_GATE_GUARD_v0.1.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_SURFACE_PROTOCOL_v0.2.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_PROTOCOL_v0.3.json'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_RELAXATION_PROTOCOL_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
      - name: Validate post-extension coupled-gate lineage
        run: python systems/h_ru0001/test_system3_post_extension_coupled_guard_v1.py
