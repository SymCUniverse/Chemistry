name: System3 H Ru0001 K28 native checkpoint recovery v1

on:
  push:
    branches: [personal-free-compute]
    paths:
      - '.github/workflows/system3-h-ru0001-k28-native-checkpoint-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system3-h-ru0001-k28-native-checkpoint-recovery
  cancel-in-progress: false

env:
  RECOVERY: systems/h_ru0001/SYSTEM3_POST_HOLD_K28_TIMEOUT_CHECKPOINT_RECOVERY_v0.1.json
  PROTOCOL: systems/h_ru0001/SYSTEM3_POST_HOLD_KMESH_DIAGNOSTIC_PROTOCOL_v0.1.json
  HOLD: systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_HOLD_RECORD_v0.1.json
  K24: systems/h_ru0001/SYSTEM3_POST_HOLD_K24_VALID_EVIDENCE_v0.1.json
  RUNNER: systems/h_ru0001/system3_k28_native_checkpoint_recovery_v1.py
  RUNNER_BLOB_SHA: 7cc0af57395fe982738c9349a483d44434981d9c
  ORIGINAL_RUNNER: systems/h_ru0001/system3_post_hold_kmesh_diagnostic_v1.py
  ORIGINAL_RUNNER_BLOB_SHA: 4a8925e2272e8f3b9eb4360f4024b154bacdf573
  SURFACE_PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_SURFACE_PROTOCOL_v0.2.json
  GUARD: systems/h_ru0001/SYSTEM3_POST_EXTENSION_COUPLED_GATE_GUARD_v0.1.json
  SUCCESSOR_PREP: systems/h_ru0001/SYSTEM3_SUCCESSOR_FIXED_GRID_PREPARATION_PROTOCOL_v0.1.json
  SUCCESSOR_PREPARER: systems/h_ru0001/system3_successor_fixed_grid_preparer_v1.py
  BOOTSTRAP_ZIP: systems/co_cu111/personal_bootstrap/co-cu111-l15-l17-site-depth-inputs-v2.zip
  BOOTSTRAP_SHA256: babc1533a8c894420762c734e853a5009497cada508441573f8cef552e6ca257
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  SSSP_V2_SHA256: 67c59659953f32b87ebf1e7e59b5cdd55bcaca02b518532098c339c0d11193c2
  RU_SHA256: ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd
  SSSP_V2_URL: https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  segment-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Enforce public zero-paid K28 recovery route and exact runners
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'SymCUniverse/Chemistry'
          test "${{ github.event.repository.private }}" = 'false'
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          test "$(git hash-object "$ORIGINAL_RUNNER")" = "$ORIGINAL_RUNNER_BLOB_SHA"
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24"
          echo SYSTEM3_K28_CHECKPOINT_ZERO_PAID_ROUTE_PASS
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Run K28 native checkpoint segment 1 with visible heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24" --segment 1 --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out k28_bundle_1
      - name: Upload K28 segment 1 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-1-v1
          path: k28_bundle_1
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-2:
    needs: segment-1
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-1-v1
          path: previous_bundle
      - name: Revalidate exact K28 recovery contract and runners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          test "$(git hash-object "$ORIGINAL_RUNNER")" = "$ORIGINAL_RUNNER_BLOB_SHA"
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume K28 native checkpoint segment 2 with visible heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24" --segment 2 --previous previous_bundle --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out k28_bundle_2
      - name: Upload K28 segment 2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-2-v1
          path: k28_bundle_2
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  segment-3:
    needs: segment-2
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-2-v1
          path: previous_bundle
      - name: Revalidate exact K28 recovery contract and runners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          test "$(git hash-object "$ORIGINAL_RUNNER")" = "$ORIGINAL_RUNNER_BLOB_SHA"
          python3 -m py_compile "$RUNNER" "$ORIGINAL_RUNNER"
          python3 "$RUNNER" self-test --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24"
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Reconstruct exact frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_ZIP" | sha256sum -c -
          mkdir -p engine/bin engine/meta hr_pseudos
          unzip -p "$BOOTSTRAP_ZIP" engine/bin/pw.x > engine/bin/pw.x
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 "$SSSP_V2_URL" -o engine/meta/SSSP-lib-pbe-eff-v2.tar.gz
          echo "$SSSP_V2_SHA256  engine/meta/SSSP-lib-pbe-eff-v2.tar.gz" | sha256sum -c -
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo "$RU_SHA256  hr_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf" | sha256sum -c -
          ! ldd engine/bin/pw.x | grep -q 'not found'
      - name: Resume K28 native checkpoint segment 3 with visible heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-segment --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24" --segment 3 --previous previous_bundle --pw engine/bin/pw.x --pseudo-dir hr_pseudos --out k28_bundle_3
      - name: Upload K28 segment 3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-3-v1
          path: k28_bundle_3
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  adjudicate-recovered-diagnostic:
    needs: segment-3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: system3-h-ru0001-k28-checkpoint-segment-3-v1
          path: final_bundle
      - name: Revalidate K28 recovery and materialize K24 plus K28 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$RUNNER")" = "$RUNNER_BLOB_SHA"
          test "$(git hash-object "$ORIGINAL_RUNNER")" = "$ORIGINAL_RUNNER_BLOB_SHA"
          python3 "$RUNNER" self-test --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24"
          mkdir -p diagnostic_results/k24 diagnostic_results/k28
          python3 "$RUNNER" materialize-k24 --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24" --out diagnostic_results/k24/SYSTEM3_POST_HOLD_K24_RESULT.json
          python3 "$RUNNER" finalize --recovery "$RECOVERY" --protocol "$PROTOCOL" --hold "$HOLD" --k24-evidence "$K24" --bundle final_bundle --out diagnostic_results/k28/SYSTEM3_POST_HOLD_K28_RESULT.json
      - name: Apply original frozen K20 K24 K28 diagnostic adjudicator
        shell: bash
        run: |
          set -euo pipefail
          python3 "$ORIGINAL_RUNNER" self-test --protocol "$PROTOCOL" --hold "$HOLD" --surface-protocol "$SURFACE_PROTOCOL" --guard "$GUARD"
          mkdir -p adjudication successor_decision
          python3 "$ORIGINAL_RUNNER" adjudicate --protocol "$PROTOCOL" --hold "$HOLD" --surface-protocol "$SURFACE_PROTOCOL" --guard "$GUARD" --results-root diagnostic_results --out adjudication/SYSTEM3_POST_HOLD_KMESH_DIAGNOSTIC_RESULT_v0.1_checkpoint_recovery.json
          python3 - <<'PY'
          import json
          p='adjudication/SYSTEM3_POST_HOLD_KMESH_DIAGNOSTIC_RESULT_v0.1_checkpoint_recovery.json'
          r=json.load(open(p))
          assert r['original_coupled_hold_preserved'] is True
          assert r['CLEAN_SURFACE_FIXED_GRID_PASS_emitted'] is False
          assert r['relaxation_authorized'] is False
          assert r['tolerance_ev_per_surface_atom']==0.001
          print('ORIGINAL_COUPLED_HOLD_PRESERVED=true')
          print('RELAXATION_AUTHORIZED=false')
          print('DIAGNOSTIC_STATUS='+r['status'])
          print('K20_vs_K28_eV='+str(r['absolute_deltas_ev_per_surface_atom']['K20_vs_K28']))
          print('K24_vs_K28_eV='+str(r['absolute_deltas_ev_per_surface_atom']['K24_vs_K28']))
          PY
      - name: Apply prospectively frozen successor-selection rule without promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SUCCESSOR_PREPARER" prepare \
            --preparation-protocol "$SUCCESSOR_PREP" \
            --diagnostic-protocol "$PROTOCOL" \
            --hold "$HOLD" \
            --diagnostic-result adjudication/SYSTEM3_POST_HOLD_KMESH_DIAGNOSTIC_RESULT_v0.1_checkpoint_recovery.json \
            --out successor_decision/SYSTEM3_SUCCESSOR_FIXED_GRID_PREPARATION_DECISION_v0.1.json
          cat successor_decision/SYSTEM3_SUCCESSOR_FIXED_GRID_PREPARATION_DECISION_v0.1.json
      - name: Upload recovered K28 and diagnostic adjudication
        uses: actions/upload-artifact@v4
        with:
          name: system3-h-ru0001-k28-recovered-diagnostic-adjudication-v1
          path: |
            diagnostic_results
            adjudication
            successor_decision
          retention-days: 90
          if-no-files-found: error
